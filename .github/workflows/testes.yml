name: Rodar testes no Git

on:
  push:
  pull_request:

jobs:
  rodar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npx cypress run
