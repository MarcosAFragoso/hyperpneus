name: Rodar testes no Git

on:
  push:
  pull_request:

jobs:
  rodar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm ci

      - name: Subir aplicacao
        run: npm start &
      
      - name: Esperar servidor
        run: npx wait-on http://localhost:3000

      - name: Rodar Cypress
        run: npx cypress run
``
