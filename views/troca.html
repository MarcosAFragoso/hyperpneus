<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Solicitar Troca - HyperPneus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .product-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border: 1px solid #eee;
            padding: 5px;
            border-radius: 4px;
        }

        .btn-confirmar {
            background-color: #ff6500;
            color: white;
            font-weight: bold;
            border: none;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container my-5">
        <a href="minha-conta.html" class="text-muted text-decoration-none"><i class="fas fa-arrow-left"></i> Voltar</a>
        <h2 class="fw-bold my-3">Troca ou Devolução</h2>

        <div class="card shadow-sm p-4">
            <h5 class="fw-bold" id="tituloPedido">Carregando...</h5>
            <div id="containerItens" class="my-4"></div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Motivo</label>
                    <select id="motivoTroca" class="form-select">
                        <option>Produto com defeito</option>
                        <option>Comprei medida errada</option>
                        <option>Arrependimento</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Desejo</label>
                    <select id="acaoDesejada" class="form-select">
                        <option value="Vale-Troca">Vale-Troca (Crédito)</option>
                        <option value="Estorno">Estorno no cartão</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-confirmar w-100 py-2" onclick="finalizarTroca()">SOLICITAR AGORA</button>
            <div id="resultadoTroca" class="mt-3"></div>
        </div>
    </div>

    <script>
        let pedidoId = null;

        async function carregarPedidoReal() {
            const params = new URLSearchParams(window.location.search);
            pedidoId = params.get('pedido');
            const res = await fetch(`/api/pedidos/${pedidoId}`);
            const dados = await res.json();

            // Título dinâmico sem o "Carregando"
            document.getElementById('tituloPedido').textContent = `Pedido #${dados.id}`;

            const trocas = dados.trocasFeitas || [];

            document.getElementById('containerItens').innerHTML = dados.itens.map(item => {
                // Soma das quantidades já em trocas ativas para este pneu (exceto NEGADO)
                const qtdEmTroca = trocas
                    .filter(t => t.pneu_id === item.pneu_id && t.status !== 'NEGADO')
                    .reduce((acc, t) => acc + (t.quantidade_trocada || 1), 0);

                const qtdDisponivel = item.quantidade - qtdEmTroca;
                const todosEmTroca  = qtdDisponivel <= 0;

                // Cupom do registro mais recente (se houver)
                const trocaComCupom = trocas.find(t => t.pneu_id === item.pneu_id && t.codigo);
                const trocaPendente = trocas.find(t => t.pneu_id === item.pneu_id && !t.codigo && t.status !== 'NEGADO');

                let statusHtml = '';
                if (trocaComCupom) {
                    statusHtml = `<br><small class="text-primary fw-bold"><i class="fas fa-tag me-1"></i>Cupom: ${trocaComCupom.codigo}</small>`;
                } else if (trocaPendente) {
                    statusHtml = `<br><small class="text-warning"><i class="fas fa-clock me-1"></i>Aguardando aprovação (${qtdEmTroca} und)</small>`;
                }

                if (todosEmTroca) {
                    return `
        <div class="d-flex align-items-center mb-3 border-bottom pb-3 item-troca" data-preco="${item.preco_unitario}">
            <div class="text-success me-3"><i class="fas fa-check-circle"></i> Trocado</div>
            <img src="${item.imagem_url || ''}" class="product-img me-3">
            <div class="flex-grow-1">
                <label class="fw-bold">${item.marca} ${item.modelo}</label><br>
                <small>R$ ${parseFloat(item.preco_unitario).toFixed(2)}</small>
                ${statusHtml}
            </div>
        </div>`;
                }

                return `
        <div class="d-flex align-items-center mb-3 border-bottom pb-3 item-troca" data-preco="${item.preco_unitario}">
            <input class="form-check-input check-item me-3" type="checkbox" value="${item.pneu_id}">
            <img src="${item.imagem_url || ''}" class="product-img me-3">
            <div class="flex-grow-1">
                <label class="fw-bold">${item.marca} ${item.modelo}</label><br>
                <small>R$ ${parseFloat(item.preco_unitario).toFixed(2)}</small>
                ${statusHtml}
                ${qtdEmTroca > 0
                    ? `<br><small class="text-muted"><i class="fas fa-info-circle me-1"></i>${qtdEmTroca} und já em troca · ${qtdDisponivel} disponíve${qtdDisponivel === 1 ? 'l' : 'is'}</small>`
                    : ''
                }
            </div>
            <select class="form-select w-auto qtd-devolver">
                ${Array.from({ length: qtdDisponivel }, (_, i) =>
                    `<option value="${i + 1}">${i + 1} und</option>`
                ).join('')}
            </select>
        </div>`;
            }).join('');
        }

        async function finalizarTroca() {
            const linhas = document.querySelectorAll('.item-troca');
            let itensParaTroca = [];
            let valorTotal = 0;

            linhas.forEach(linha => {
                const checkbox = linha.querySelector('.check-item');
                if (checkbox.checked) {
                    const pneuId = parseInt(checkbox.value);
                    const qtd = parseInt(linha.querySelector('.qtd-devolver').value);
                    const preco = parseFloat(linha.getAttribute('data-preco'));
                    itensParaTroca.push({ pneu_id: pneuId, qtd: qtd });
                    valorTotal += (qtd * preco);
                }
            });

            if (itensParaTroca.length === 0) return alert("Selecione pelo menos um item para prosseguir.");

            const acao = document.getElementById('acaoDesejada').value;
            const res = await fetch('/api/pedidos/gerar-cupom-troca', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pedidoId, itensParaTroca, valorTotal, acao })
            });

            const data = await res.json();
            const divResultado = document.getElementById('resultadoTroca');

            if (res.ok) {
                const msgSucesso = acao === 'Estorno'
                    ? 'Solicitação de estorno enviada! Aguarde a análise do administrador.'
                    : 'Solicitação de troca enviada! O cupom será gerado após aprovação do administrador.';
                divResultado.innerHTML = `
                    <div class="alert alert-success mt-3">
                        <i class="fas fa-check-circle me-2"></i>${msgSucesso}
                        <hr class="my-2">
                        <small class="text-muted">
                            <i class="fas fa-info-circle me-1"></i>
                            Você receberá o código do cupom em <strong>Meus Pedidos</strong> após a aprovação.
                        </small>
                    </div>`;
                // Desabilita botão para evitar duplo envio
                document.querySelector('.btn-confirmar').disabled = true;
                document.querySelector('.btn-confirmar').textContent = 'Solicitação Enviada';
            } else {
                const msgErro = data.erro || 'Alguns itens já possuem solicitação de troca ativa.';
                divResultado.innerHTML = `
                    <div class="alert alert-warning mt-3">
                        <i class="fas fa-exclamation-circle me-2"></i>${msgErro}
                    </div>`;
            }
        }
        window.onload = carregarPedidoReal;
    </script>
</body>

</html>
