<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Pedido Confirmado - HyperPneus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .step-track {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 30px 0;
            padding: 0 22px;
        }

        .step-track::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 22px;
            right: 22px;
            height: 4px;
            background: #dee2e6;
            z-index: 0;
        }

        .progress-line {
            position: absolute;
            top: 20px;
            left: 22px;
            height: 4px;
            background: #198754;
            z-index: 1;
            width: 0%;
            transition: width 1s ease;
            max-width: calc(100% - 44px);
        }

        .step-item {
            text-align: center;
            position: relative;
            z-index: 2;
            flex: 1;
        }

        .step-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #dee2e6;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-size: 18px;
            transition: all 0.5s ease;
        }

        .step-icon.ativo {
            background: #198754;
            color: white;
        }

        .step-icon.atual {
            background: #0d6efd;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(13, 110, 253, .4);
            }

            50% {
                box-shadow: 0 0 0 10px rgba(13, 110, 253, 0);
            }
        }

        .step-label {
            font-size: 12px;
            color: #888;
        }

        .step-label.ativo {
            color: #198754;
            font-weight: bold;
        }

        .step-label.atual {
            color: #0d6efd;
            font-weight: bold;
        }

        .card-status {
            border-left: 4px solid #198754;
        }

        #nfModal .modal-body {
            font-family: monospace;
            font-size: 12px;
            background: #f8f9fa;
        }

        .log-entry {
            animation: fadeIn .4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand" href="index.html">HyperPneus</a>
            <a href="minha-conta.html" class="btn btn-outline-light btn-sm">Minha Conta</a>
        </div>
    </nav>

    <div class="container my-5">

        <div class="text-center mb-5" id="animacaoProcessando" data-cy="animacao-processando">
            <div id="iconePagamento" class="mb-3">
                <i class="fas fa-spinner fa-spin fa-4x text-primary"></i>
            </div>
            <h2 id="tituloPagamento" class="fw-bold">Processando pagamento...</h2>
            <p id="subtituloPagamento" class="text-muted">Aguarde, estamos confirmando sua compra.</p>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="fw-bold mb-4">
                    <i class="fas fa-truck me-2 text-primary"></i>
                    Acompanhamento do Pedido
                    <span id="numeroPedido" class="badge bg-dark ms-2"></span>
                </h5>

                <div class="step-track">
                    <div class="progress-line" id="progressLine"></div>

                    <div class="step-item" id="step0">
                        <div class="step-icon ativo"><i class="fas fa-check"></i></div>
                        <div class="step-label ativo">Pedido<br>Recebido</div>
                    </div>
                    <div class="step-item" id="step1">
                        <div class="step-icon"><i class="fas fa-credit-card"></i></div>
                        <div class="step-label">Pagamento<br>Confirmado</div>
                    </div>
                    <div class="step-item" id="step2">
                        <div class="step-icon"><i class="fas fa-box"></i></div>
                        <div class="step-label">Em<br>Separação</div>
                    </div>
                    <div class="step-item" id="step3">
                        <div class="step-icon"><i class="fas fa-shipping-fast"></i></div>
                        <div class="step-label">Na<br>Transportadora</div>
                    </div>
                    <div class="step-item" id="step4">
                        <div class="step-icon"><i class="fas fa-truck"></i></div>
                        <div class="step-label">Saiu para<br>Entrega</div>
                    </div>
                    <div class="step-item" id="step5">
                        <div class="step-icon"><i class="fas fa-home"></i></div>
                        <div class="step-label">Entregue</div>
                    </div>
                </div>

                <div id="logEventos" class="mt-4 border-top pt-3"></div>
            </div>
        </div>

        <div class="row g-4" id="cardsResumo" style="display:none!important">
            <div class="col-md-4">
                <div class="card shadow-sm h-100 card-status">
                    <div class="card-body">
                        <h6 class="text-muted mb-1"><i class="fas fa-map-marker-alt me-2"></i>Entrega em</h6>
                        <p class="mb-0 fw-bold" id="enderecoConfirm"></p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm h-100 card-status">
                    <div class="card-body">
                        <h6 class="text-muted mb-1"><i class="fas fa-receipt me-2"></i>Resumo</h6>
                        <div id="resumoConfirm"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm h-100 card-status">
                    <div class="card-body">
                        <h6 class="text-muted mb-1"><i class="fas fa-credit-card me-2"></i>Pagamento</h6>
                        <div id="pagamentoConfirm"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-4 d-flex gap-3 justify-content-center" id="acoes" style="display:none!important">
            <button onclick="verNF()" class="btn btn-outline-secondary">
                <i class="fas fa-file-invoice me-2"></i>Ver Nota Fiscal
            </button>
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-shopping-bag me-2"></i>Continuar Comprando
            </a>
            <a href="minha-conta.html" class="btn btn-outline-dark">
                <i class="fas fa-box me-2"></i>Meus Pedidos
            </a>
        </div>
    </div>

    <div class="modal fade" id="nfModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-file-invoice me-2"></i>Nota Fiscal Eletrônica</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="conteudoNF"></div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" onclick="imprimirNF()">
                        <i class="fas fa-print me-2"></i>Imprimir
                    </button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let pedidoData = null;

        // ── MAPA GLOBAL DE ETAPAS DO PEDIDO ────────────────────────────
        const ETAPAS_PEDIDO = [
            {
                status: 'AGUARDANDO_PAGAMENTO',
                titulo: 'Processando pagamento...',
                subtitulo: 'Aguarde, estamos confirmando sua compra.',
                icone: 'fa-spinner fa-spin text-primary',
                log: 'Pedido recebido e registrado no sistema.',
                logTipo: 'success'
            },
            {
                status: 'PAGAMENTO_APROVADO',
                titulo: 'Pagamento Confirmado',
                subtitulo: 'Seu pagamento foi aprovado.',
                icone: 'fa-check-circle text-success',
                log: '✓ Pagamento aprovado pela operadora.',
                logTipo: 'success'
            },
            {
                status: 'EM_PROCESSAMENTO',
                titulo: 'Em Separação',
                subtitulo: 'Seu pedido está sendo preparado.',
                icone: 'fa-box text-primary',
                log: '📦 Pedido em separação.',
                logTipo: 'info'
            },
            {
                status: 'ENVIADO',
                titulo: 'Na Transportadora',
                subtitulo: 'Seu pedido está em trânsito.',
                icone: 'fa-truck text-info',
                log: '🚚 Pedido na transportadora.',
                logTipo: 'info'
            },
            {
                status: 'SAIU_PARA_ENTREGA',
                titulo: 'Saiu para Entrega',
                subtitulo: 'Seu pedido está a caminho.',
                icone: 'fa-shipping-fast text-primary',
                log: '🚚 Saiu para entrega.',
                logTipo: 'truck'
            },
            {
                status: 'ENTREGUE',
                titulo: 'Pedido Entregue',
                subtitulo: 'Seu pedido foi entregue com sucesso!',
                icone: 'fa-home text-success',
                log: '🏠 Pedido entregue com sucesso!',
                logTipo: 'home'
            }
        ];

        function fmt(v) {
            return parseFloat(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function obterLinhasPagamento() {
            const pagamentos = pedidoData?.pagamentos || [];
            const linhas = pagamentos.map(p => ({
                html: `<div>${p.bandeira} **** ${p.numero_final}<br>
                 <small class="text-muted">${fmt(p.valor)}</small></div>`,
                nf: `${p.bandeira} **** ${p.numero_final}: ${fmt(p.valor)}`
            }));

            if (pedidoData?.cupom_codigo) {
                const tipoCupom = pedidoData.cupom_tipo === 'troca'
                    ? 'Cupom de troca'
                    : 'Cupom promocional';
                linhas.push({
                    html: `<div>${tipoCupom}<br>
                 <small class="text-muted">${pedidoData.cupom_codigo} - ${fmt(pedidoData.cupom_valor || 0)}</small></div>`,
                    nf: `${tipoCupom} ${pedidoData.cupom_codigo}: ${fmt(pedidoData.cupom_valor || 0)}`
                });
            }

            return linhas;
        }

        function renderizarPagamento() {
            const linhas = obterLinhasPagamento();

            if (!linhas.length) {
                return 'Pagamento processado';
            }

            return linhas.map(l => l.html).join('<hr class="my-1">');
        }

        function renderizarPagamentoNF() {
            const linhas = obterLinhasPagamento();

            if (!linhas.length) {
                return 'Pagamento processado';
            }

            return linhas.map(l => l.nf).join('\n');
        }

        // ── Log de eventos ─────────────────────────────────────────────
        function adicionarLog(msg, tipo = 'success', hora = null) {
            const icons = {
                success: 'fa-check-circle text-success',
                info: 'fa-info-circle text-primary',
                warning: 'fa-clock text-warning',
                truck: 'fa-truck text-info',
                home: 'fa-home text-success'
            };
            const h = hora || new Date().toLocaleTimeString('pt-BR');
            const log = document.getElementById('logEventos');
            const div = document.createElement('div');
            div.className = 'd-flex align-items-start gap-2 mb-2 log-entry';
            div.innerHTML = `
        <i class="fas ${icons[tipo] || icons.info} mt-1"></i>
        <div><span>${msg}</span><small class="text-muted ms-2">${h}</small></div>`;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        // ── Carregar dados do pedido ───────────────────────────────────
        async function carregarPedido(pedidoId) {
            try {
                const res = await fetch(`/api/pedidos/${pedidoId}`);
                if (!res.ok) throw new Error();
                pedidoData = await res.json();
                document.getElementById('numeroPedido').textContent = `#${pedidoData.id}`;

                document.getElementById('enderecoConfirm').innerHTML = `
            ${pedidoData.logradouro}, ${pedidoData.numero}<br>
            ${pedidoData.bairro} — ${pedidoData.cidade}/${pedidoData.estado}<br>
            <small class="text-muted">CEP: ${pedidoData.cep}</small>`;

                document.getElementById('resumoConfirm').innerHTML = `
            <small class="text-muted">${pedidoData.itens?.length || 0} item(s)</small><br>
            Frete: ${fmt(pedidoData.frete)}<br>
            <strong class="text-primary fs-5">${fmt(pedidoData.total)}</strong>`;

                document.getElementById('pagamentoConfirm').innerHTML = renderizarPagamento();

            } catch (e) { console.warn('Erro ao carregar pedido', e); }
        }

        function mostrarCardsEAcoes() {
            document.getElementById('cardsResumo').style.display = 'flex';
            document.getElementById('acoes').style.display = 'flex';
        }

        function esperar(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ── MODO SIMULAÇÃO (vindo do checkout) ────────────────────────
        async function iniciarSimulacao(pedidoId) {
            try { await carregarPedido(pedidoId); } catch (e) { console.error(e); }

            const porcentagens = [0, 20, 40, 60, 80, 100];

            for (let i = 0; i < ETAPAS_PEDIDO.length; i++) {
                const etapa = ETAPAS_PEDIDO[i];

                // Atualiza Título, Subtítulo e Ícone no topo
                document.getElementById('iconePagamento').innerHTML = `<i class="fas ${etapa.icone} fa-4x"></i>`;
                document.getElementById('tituloPagamento').textContent = etapa.titulo;
                document.getElementById('subtituloPagamento').textContent = etapa.subtitulo;

                // Adiciona o Log e avança a barra
                adicionarLog(etapa.log, etapa.logTipo);
                ativarStep(i, porcentagens[i], i < 5);

                // Mostra os cards de resumo logo após aprovar o pagamento
                if (i === 1) mostrarCardsEAcoes();

                // Espera 2 segundos antes de ir para o próximo passo (exceto no último)
                if (i < ETAPAS_PEDIDO.length - 1) {
                    await esperar(2000);
                }
            }

            // ATUALIZAÇÃO DO BANCO (No final de tudo)
            try {
                await fetch(`/api/pedidos/${pedidoId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'ENTREGUE' })
                });
            } catch (err) { console.log("Erro ao salvar no banco, ignorando..."); }
        }

        // ── MODO VISUALIZAÇÃO (vindo de Meus Pedidos) ─────────────────
        async function modoVisualizacao(pedidoId) {
            await carregarPedido(pedidoId);

            const statusNormalizado = pedidoData.status?.trim().toUpperCase();

            // Descobre o índice do status atual no nosso array
            const idxAtual = ETAPAS_PEDIDO.findIndex(e => e.status === statusNormalizado);
            const idxValido = idxAtual === -1 ? 0 : idxAtual;

            const etapaAtual = ETAPAS_PEDIDO[idxValido];
            const porcentagens = [0, 20, 40, 60, 80, 100];

            // Atualiza topo
            document.getElementById('iconePagamento').innerHTML = `<i class="fas ${etapaAtual.icone} fa-4x"></i>`;
            document.getElementById('tituloPagamento').textContent = etapaAtual.titulo;
            document.getElementById('subtituloPagamento').textContent = etapaAtual.subtitulo;

            // Preenche o histórico de logs até o ponto atual
            document.getElementById('logEventos').innerHTML = '';
            for (let i = 0; i <= idxValido; i++) {
                adicionarLog(
                    ETAPAS_PEDIDO[i].log,
                    ETAPAS_PEDIDO[i].logTipo,
                    new Date(pedidoData.criado_em).toLocaleTimeString('pt-BR')
                );
            }

            ativarStep(idxValido, porcentagens[idxValido]);
            mostrarCardsEAcoes();
        }

        // ── Ativar step na trilha ──────────────────────────────────────
        function ativarStep(idx, progressPct, ehAtual = true) {
            for (let i = 0; i <= 5; i++) {
                const step = document.getElementById(`step${i}`);
                if (!step) continue;

                const icon = step.querySelector('.step-icon');
                const label = step.querySelector('.step-label');

                if (!icon || !label) continue;

                icon.classList.remove('atual', 'ativo');
                label.classList.remove('atual', 'ativo');

                // 🔥 TODOS OS ANTERIORES = VERDE
                if (i < idx) {
                    icon.classList.add('ativo');
                    label.classList.add('ativo');
                }

                // 🔥 ATUAL = AZUL (MENOS SE FOR ENTREGUE)
                else if (i === idx) {
                    if (idx === 5) {
                        // 🚨 ENTREGUE = VERDE
                        icon.classList.add('ativo');
                        label.classList.add('ativo');
                    } else {
                        icon.classList.add('atual');
                        label.classList.add('atual');
                    }
                }
            }

            document.getElementById('progressLine').style.width = progressPct + '%';
        }

        // ── Nota Fiscal ────────────────────────────────────────────────
        function verNF() {
            if (!pedidoData) return;
            const nf = `
NOTA FISCAL ELETRÔNICA - NF-e
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
HYPERPNEUS LTDA
CNPJ: 00.000.000/0001-00
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Número do Pedido : #${pedidoData.id}
Data de Emissão  : ${new Date().toLocaleDateString('pt-BR')} ${new Date().toLocaleTimeString('pt-BR')}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
DESTINATÁRIO
${pedidoData.logradouro}, ${pedidoData.numero}
${pedidoData.bairro} - ${pedidoData.cidade}/${pedidoData.estado}
CEP: ${pedidoData.cep}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
ITENS
${(pedidoData.itens || []).map(i =>
                `${i.marca} ${i.modelo} ${i.largura}/${i.perfil} R${i.aro}
  Qtd: ${i.quantidade} x ${fmt(i.preco_unitario)} = ${fmt(i.preco_unitario * i.quantidade)}`
            ).join('\n')}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Frete            : ${fmt(pedidoData.frete)}
TOTAL            : ${fmt(pedidoData.total)}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
FORMA DE PAGAMENTO
${renderizarPagamentoNF()}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Chave NF-e: ${Math.random().toString(36).substr(2, 44).toUpperCase()}
    `;
            document.getElementById('conteudoNF').innerHTML = `<pre>${nf}</pre>`;
            new bootstrap.Modal(document.getElementById('nfModal')).show();
        }

        function imprimirNF() {
            const conteudo = document.getElementById('conteudoNF').innerHTML;
            const w = window.open('', '_blank');
            w.document.write(`<html><body><pre style="font-family:monospace">${conteudo}</pre></body></html>`);
            w.print();
        }

        // ── Init ───────────────────────────────────────────────────────
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const pedidoId = params.get('pedido');
            const modo = params.get('modo');

            if (!pedidoId) { window.location.href = 'index.html'; return; }

            if (modo === 'visualizar') {
                modoVisualizacao(pedidoId);
            } else {
                iniciarSimulacao(pedidoId);
            }
        };
    </script>
</body>

</html>
